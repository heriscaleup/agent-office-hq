name: Deploy Swarm HQ to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify required secrets are configured
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          HQ_PASSWORD: ${{ secrets.HQ_PASSWORD }}
          HQ_AUTH_SECRET: ${{ secrets.HQ_AUTH_SECRET }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USERNAME" ] || [ -z "$VPS_PASSWORD" ] || [ -z "$HQ_PASSWORD" ] || [ -z "$HQ_AUTH_SECRET" ]; then
            echo "::error::Missing one or more required secrets (VPS_HOST, VPS_USERNAME, VPS_PASSWORD, HQ_PASSWORD, HQ_AUTH_SECRET). Set them in repo Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            echo "🚀 [CI/CD] Starting Deployment to /opt/agent-office-hq..."
            
            # Ensure target directory exists
            mkdir -p /opt/agent-office-hq
            cd /opt/agent-office-hq
            
            # If git repo already initialized, pull latest; otherwise clone/fetch
            if [ -d ".git" ]; then
              git fetch --all
              git reset --hard origin/main
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }}.git /tmp/agent-hq-clone
              cp -rf /tmp/agent-hq-clone/* /opt/agent-office-hq/
              cp -rf /tmp/agent-hq-clone/.git /opt/agent-office-hq/
              rm -rf /tmp/agent-hq-clone
            fi

            # Recreate Docker container (always, not just on first run) so env
            # vars below stay in sync with secrets instead of silently drifting
            # back to source defaults if the container is ever lost.
            echo "🔄 [CI/CD] Recreating Docker container agent-office-hq..."
            docker stop agent-office-hq 2>/dev/null || true
            docker rm agent-office-hq 2>/dev/null || true
            # No host port is published. Traefik on the Coolify network is the
            # trusted proxy responsible for sanitizing forwarded IP headers.
            docker run -d --name agent-office-hq --restart always --network coolify \
              -v /opt/agent-office-hq:/app -w /app \
              -e HQ_PASSWORD="${{ secrets.HQ_PASSWORD }}" \
              -e HQ_AUTH_SECRET="${{ secrets.HQ_AUTH_SECRET }}" \
              -e NODE_ENV=production \
              -e TRUST_PROXY=true \
              -e GSC_SERVICE_ACCOUNT_JSON="${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}" \
              -e GOOGLE_ADS_DEVELOPER_TOKEN="${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}" \
              -e GOOGLE_ADS_CLIENT_ID="${{ secrets.GOOGLE_ADS_CLIENT_ID }}" \
              -e GOOGLE_ADS_CLIENT_SECRET="${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}" \
              -e GOOGLE_ADS_REFRESH_TOKEN="${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}" \
              -e GOOGLE_ADS_CUSTOMER_ID="${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}" \
              -e GOOGLE_ADS_LOGIN_CUSTOMER_ID="${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}" \
              -e GOOGLE_ADS_API_VERSION="${{ vars.GOOGLE_ADS_API_VERSION }}" \
              -e NADIA_GOOGLE_ADS_LOOKBACK_DAYS="${{ vars.NADIA_GOOGLE_ADS_LOOKBACK_DAYS }}" \
              -e NADIA_MAX_GOOGLE_ADS_ROWS="${{ vars.NADIA_MAX_GOOGLE_ADS_ROWS }}" \
              node:20-alpine node server.mjs

            echo "✅ [CI/CD] Deployment completed successfully! Live on https://seo.tepatlaser.com"
